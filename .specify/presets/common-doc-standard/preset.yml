schema_version: "1.0"

preset:
  id: "common-doc-standard"
  name: "CommonDoc Standard"
  version: "1.0.0"
  description: "The CommonDoc constitution standard, resolved into every derived repository."
  author: "common-doc"
  repository: "https://github.com/common-doc/commondoc"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "CommonDoc constitution"
      replaces: "constitution-template"
      strategy: "replace"

tags:
  - "commondoc"
  - "constitution"
  - "standard"
